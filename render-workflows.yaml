# Optional Render Blueprint for the RELIEFOS workflow service (Render Workflows is billed per task
# run; it has no free tier). Apply separately from render.yaml, then set on the web service:
#   RENDER_API_KEY=<API key>   RENDER_WORKFLOW_SLUG=<this workflow's slug, e.g. reliefos-workflows>
# Until then the web service runs the same jobs in-process.
services:
  - type: workflow
    name: reliefos-workflows
    runtime: node
    region: virginia
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node dist/server/server/workflows/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reliefos-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
